name: Auto approve # reusable: approve trusted bot PRs

on:
  workflow_call:
    inputs:
      actors:
        description: "Comma separated actors whose PRs are auto approved"
        type: string
        default: "dependabot[bot],github-actions[bot]"

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: contains(inputs.actors, github.actor)

    steps:
      - name: Approve
        uses: hmarr/auto-approve-action@v4
        with:
          review-message: "Auto approved PR"
