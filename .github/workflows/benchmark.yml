name: Benchmarks # reusable: run BenchmarkDotNet and store results

on:
  workflow_call:
    inputs:
      project:
        description: "Benchmark project directory"
        required: true
        type: string
      results-dir:
        description: "Directory with the exported json report"
        type: string
        default: "BenchmarkDotNet.Artifacts/results"
      dotnet-version:
        description: "Dotnet version"
        type: string
        default: "8.0.x"
      gh-pages-branch:
        description: "Branch to store benchmark results"
        type: string
        default: "gh-pages"
      data-dir:
        description: "Directory in gh-pages to store results"
        type: string
        default: "dev/bench"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: jirikostiha/ci/.github/actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin ${{ inputs.gh-pages-branch }}; then
            echo "Branch ${{ inputs.gh-pages-branch }} does not exist on remote. Initializing orphan branch..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            EMPTY_TREE=$(git mktree < /dev/null)
            EMPTY_COMMIT=$(git commit-tree "$EMPTY_TREE" -m "chore: initialize ${{ inputs.gh-pages-branch }} branch")
            git push origin "$EMPTY_COMMIT:refs/heads/${{ inputs.gh-pages-branch }}"
          else
            echo "Branch ${{ inputs.gh-pages-branch }} exists on remote."
          fi

      - name: Run benchmark
        run: dotnet run -c Release -- --exporters json --filter '*'
        working-directory: ${{ inputs.project }}

      - name: Find summary report
        id: summary
        run: |
          report=$(find "${{ inputs.project }}/BenchmarkDotNet.Artifacts/results" "${{ inputs.results-dir }}" . -type f \( -name '*report-full-compressed.json' -o -name '*report.json' \) 2>/dev/null | head -n 1)
          if [ -z "$report" ]; then
            echo "::error::No benchmark report (*report-full-compressed.json or *report.json) found"
            exit 1
          fi
          echo "Found benchmark report: $report"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Store benchmark result
        uses: rhysd/github-action-benchmark@v1
        with:
          name: Benchmark.Net
          tool: "benchmarkdotnet"
          output-file-path: ${{ steps.summary.outputs.report }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "200%"
          comment-on-alert: true
          gh-pages-branch: ${{ inputs.gh-pages-branch }}
          benchmark-data-dir-path: ${{ inputs.data-dir }}
