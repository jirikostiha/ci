name: Code analysis # reusable: CodeQL

on:
  workflow_call:
    inputs:
      language:
        type: string
        default: csharp
      dotnet-version:
        type: string
        default: "8.0.x"

jobs:
  analyze:
    runs-on: ubuntu-latest
    # No permissions of its own: the job inherits the caller's grant (contents: read,
    # security-events: write). A private repository adds actions: read, which CodeQL needs there
    # to read the workflow run; declaring it here would fail every caller that does not grant it.

    steps:
      # A private repository without GitHub Advanced Security has no code scanning, and an upload
      # there fails the job; analyse anyway and keep the SARIF as an artifact instead.
      - name: Detect code scanning
        id: scanning
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! gh api "repos/$REPOSITORY/code-scanning/analyses?per_page=1" --silent 2> "$RUNNER_TEMP/scanning.txt" \
            && grep -q "HTTP 403" "$RUNNER_TEMP/scanning.txt"; then
            cat "$RUNNER_TEMP/scanning.txt"
            echo "upload=never" >> "$GITHUB_OUTPUT"
          else
            echo "upload=always" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: jirikostiha/ci/.github/actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: ${{ steps.scanning.outputs.upload }}
          output: ${{ runner.temp }}/codeql-results

      - name: Upload results
        if: steps.scanning.outputs.upload == 'never'
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results
          path: ${{ runner.temp }}/codeql-results
