name: Documentation # reusable: build DocFX documentation and deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      docfx-json:
        description: "Path to docfx.json"
        type: string
        default: "docs/web/docfx.json"
      output-dir:
        description: "DocFX output directory"
        type: string
        default: "docs/web/_site"
      version:
        description: "Version to display in navbar and footer (e.g. v0.2.0)"
        type: string
        default: ""
      dotnet-version:
        description: "Dotnet version"
        type: string
        default: |
          8.0.x
          9.0.x
          10.0.x
      include-benchmarks:
        description: "Whether to include benchmark charts from gh-pages branch"
        type: boolean
        default: true
      gh-pages-branch:
        description: "Branch with benchmark results"
        type: string
        default: "gh-pages"
      benchmarks-dir:
        description: "Destination folder inside site for benchmarks"
        type: string
        default: "benchmarks"

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: jirikostiha/ci/.github/actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build Documentation
        run: |
          python3 -c "
          import os, re, json, subprocess

          docfx_json = '${{ inputs.docfx-json }}'
          with open(docfx_json, encoding='utf-8') as f:
              data = json.load(f)

          app_name = data.get('build', {}).get('globalMetadata', {}).get('_appName', '') or data.get('globalMetadata', {}).get('_appName', '')
          if not app_name:
              app_name = os.environ.get('GITHUB_REPOSITORY', '').split('/')[-1]

          version = '${{ inputs.version }}'.strip()
          if not version and os.environ.get('GITHUB_REF_TYPE') == 'tag':
              version = os.environ.get('GITHUB_REF_NAME', '').strip()

          if not version:
              try:
                  out = subprocess.check_output(['git', 'describe', '--tags', '--exact-match'], stderr=subprocess.DEVNULL)
                  version = out.decode('utf-8').strip()
              except Exception:
                  pass

          if not version:
              for root, _, files in os.walk('.'):
                  for file in files:
                      if file.endswith('.csproj') or 'version.props' in file or 'Directory.Build.props' in file:
                          try:
                              with open(os.path.join(root, file), encoding='utf-8') as pf:
                                  m = re.search(r'<(?:Version|VersionPrefix)>([^<]+)</(?:Version|VersionPrefix)>', pf.read())
                                  if m:
                                      version = m.group(1).strip()
                                      break
                          except Exception:
                              pass
                  if version:
                      break

          if version and not version.startswith('v') and version[0].isdigit():
              version = 'v' + version

          app_name_with_ver = f'{app_name} {version}'.strip() if version else app_name
          app_title = f'{app_name_with_ver} Documentation'
          app_footer = f'Documentation for {app_name_with_ver} | Generated by DocFX'

          print(f'Building DocFX: {app_name_with_ver}')

          cmd = [
              'docfx', docfx_json,
              '-m', f'_appName={app_name_with_ver}',
              '-m', f'_appTitle={app_title}',
              '-m', f'_appFooter={app_footer}'
          ]
          subprocess.check_call(cmd)
          "

      - name: Integrate benchmarks from gh-pages
        if: ${{ inputs.include-benchmarks }}
        run: |
          mkdir -p "${{ inputs.output-dir }}/${{ inputs.benchmarks-dir }}"
          if git fetch origin ${{ inputs.gh-pages-branch }} --depth=1 2>/dev/null; then
            echo "Found branch ${{ inputs.gh-pages-branch }}, checking for benchmark dashboard..."
            git --work-tree="${{ inputs.output-dir }}/${{ inputs.benchmarks-dir }}" checkout FETCH_HEAD -- . 2>/dev/null || true
            if [ -f "${{ inputs.output-dir }}/${{ inputs.benchmarks-dir }}/dev/bench/index.html" ]; then
              echo "Flattening dev/bench dashboard to root of ${{ inputs.benchmarks-dir }}..."
              cp -rf "${{ inputs.output-dir }}/${{ inputs.benchmarks-dir }}/dev/bench/"* "${{ inputs.output-dir }}/${{ inputs.benchmarks-dir }}/"
            fi
          fi

          if [ ! -f "${{ inputs.output-dir }}/${{ inputs.benchmarks-dir }}/index.html" ]; then
            echo "No index.html found, copying fallback page..."
            if [ -f "docs/web/benchmarks/index.html" ]; then
              cp -f "docs/web/benchmarks/index.html" "${{ inputs.output-dir }}/${{ inputs.benchmarks-dir }}/index.html"
            fi
          fi
          echo "Benchmarks step completed."

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.output-dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
