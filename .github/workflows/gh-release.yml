name: GitHub release # reusable: zip the "binaries" artifact and publish a release

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag / name"
        required: true
        type: string
      keep-latest:
        description: "How many releases to retain"
        type: number
        default: 8
    secrets:
      release-token:
        description: "Token used to create the release (falls back to GITHUB_TOKEN)"
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact - binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: build

      - name: Zip binaries
        uses: vimtor/action-zip@v1
        with:
          files: build
          dest: binaries.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ inputs.tag }}
          tag_name: ${{ inputs.tag }}
          prerelease: false
          draft: false
          generate_release_notes: true
          files: binaries.zip
          token: ${{ secrets.release-token || secrets.GITHUB_TOKEN }}

      - name: Remove old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: ${{ inputs.keep-latest }}
          delete_tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
