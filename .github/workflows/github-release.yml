name: GitHub release # reusable: zip the "binaries" artifact and publish a release

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag / name"
        required: true
        type: string
      product-name:
        description: "Product name used in the release zip asset (<product-name>_<tag>.zip)"
        required: false
        type: string
        default: ""
      keep-latest:
        description: "How many releases to retain, counted separately for prereleases and stable releases"
        type: number
        default: 8
      version-file:
        description: "Repository file carrying VersionPrefix/VersionSuffix; when set, the tag must equal v<prefix>[-<suffix>]"
        required: false
        type: string
        default: ""
    secrets:
      release-token:
        description: "Token used to create the release (falls back to GITHUB_TOKEN)"
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The one definition of a prerelease (jq filter over a tag): a SemVer pre-release suffix
      # (v0.3.0-dev) marks one, build metadata (v1.2.3+build-5) does not.
      IS_PRERELEASE: 'split("+")[0] | contains("-")'

    steps:
      - name: Checkout version file
        if: inputs.version-file != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          sparse-checkout: ${{ inputs.version-file }}
          sparse-checkout-cone-mode: false
          path: source

      # A release published under a tag that disagrees with the version the binaries were
      # built with is unrecoverable once consumers pick it up, so refuse it here.
      - name: Verify tag matches version file
        if: inputs.version-file != ''
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          VERSION_FILE: source/${{ inputs.version-file }}
        run: |
          [xml]$xml = Get-Content -LiteralPath $env:VERSION_FILE
          $group = @($xml.Project.PropertyGroup) | Where-Object { $_.VersionPrefix } | Select-Object -First 1
          if (-not $group) { throw "No VersionPrefix in $env:VERSION_FILE." }
          $expected = "v$("$($group.VersionPrefix)".Trim())"
          $suffix = "$($group.VersionSuffix)".Trim()
          if ($suffix) { $expected += "-$suffix" }
          if ($env:TAG -ne $expected) { throw "Tag '$env:TAG' does not match $env:VERSION_FILE (expected '$expected')." }
          Write-Host "Tag $env:TAG matches $env:VERSION_FILE."

      - name: Classify release
        id: kind
        env:
          TAG: ${{ inputs.tag }}
        run: echo "prerelease=$(jq -nr --arg tag "$TAG" "\$tag | $IS_PRERELEASE")" >> "$GITHUB_OUTPUT"

      - name: Download artifact - binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: build

      - name: Zip binaries
        run: |
          PRODUCT="${{ inputs.product-name }}"
          if [ -z "$PRODUCT" ]; then PRODUCT="${GITHUB_REPOSITORY#*/}"; fi
          ZIP_NAME="${PRODUCT}_${{ inputs.tag }}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          (cd build && zip -r "../$ZIP_NAME" .)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ inputs.tag }}
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ steps.kind.outputs.prerelease }}
          # A prerelease never becomes "latest"; '' leaves stable releases on the API default.
          make_latest: ${{ steps.kind.outputs.prerelease == 'true' && 'false' || '' }}
          draft: false
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}
          token: ${{ secrets.release-token || secrets.GITHUB_TOKEN }}

      # Prereleases and stable releases are pruned as separate pools, so a run of dev releases
      # can never push a stable release out. Pools follow the tag, not the release flag, so
      # releases published before the flag was set are pooled correctly too. Tags are kept.
      - name: Remove old releases
        env:
          GH_TOKEN: ${{ secrets.release-token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ inputs.keep-latest }}
        run: |
          [ "$KEEP" -ge 0 ] || { echo "::error::keep-latest must be 0 or more, got '$KEEP'."; exit 1; }
          gh release list --exclude-drafts --limit 1000 --json tagName,publishedAt \
            --jq "group_by(.tagName | $IS_PRERELEASE)[] | sort_by(.publishedAt) | reverse | .[$KEEP:][] | .tagName" \
          | while read -r OLD; do gh release delete "$OLD" --yes || exit 1; echo "Deleted release $OLD"; done
