name: Code lint # reusable: dotnet format, auto fix or check-only

on:
  workflow_call:
    inputs:
      dir:
        description: "Directory to format"
        type: string
        default: src
      dotnet-version:
        type: string
        default: "8.0.x"
      check-only:
        description: "Only verify formatting, never commit fixes (release gate)"
        type: boolean
        default: false
      ref:
        description: "Git ref to lint (default: the triggering ref)"
        type: string
        default: ""

jobs:
  run-linters:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup .NET
        uses: jirikostiha/ci/.github/actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Run code linters with auto fix
        uses: wearerequired/lint-action@v3
        with:
          commit_message: "style: code style issues with ${linter}"
          dotnet_format: true
          dotnet_format_dir: ${{ inputs.dir }}
          dotnet_format_auto_fix: ${{ !inputs.check-only }}
          auto_fix: ${{ !inputs.check-only }}
          git_name: "C# linter"
