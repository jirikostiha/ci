name: Commit lint # reusable: commitlint + fixup guard

on:
  workflow_call:
    inputs:
      config:
        description: "commitlint config file of the calling repository; empty uses the shared config below"
        type: string
        default: ""

jobs:
  commit-lint:
    # Dependabot writes its own commit messages (e.g. "Bump the nuget group ..."); linting them only produces red checks.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The shared config lives in this workflow, so it always matches the ref the caller pinned.
      # It follows the ai-kit git rule (rules/git.rule.md): the canonical types plus `product`.
      - name: Write shared commitlint config
        if: inputs.config == ''
        run: |
          cat > .ci-commitlint.config.mjs <<'EOF'
          export default {
              // Dependabot autogenerates "<type>: Bump <dep> from x to y" with a capital "Bump";
              // its casing is not configurable, so skip those commits. Human commits use a
              // lowercase "bump" (per the commit-message rules) and stay fully linted.
              ignores: [(message) => /^[a-z]+(\([^)]+\))?!?: Bump /.test(message)],
              rules: {
                  "body-leading-blank": [1, "always"],
                  "body-max-line-length": [2, "always", 160],
                  "footer-leading-blank": [1, "always"],
                  "footer-max-line-length": [2, "always", 160],
                  "header-max-length": [2, "always", 100],
                  "scope-case": [2, "always", "lower-case"],
                  "subject-case": [2, "never", ["upper-case", "pascal-case", "sentence-case", "start-case"]],
                  "subject-empty": [2, "never"],
                  "subject-full-stop": [2, "never", "."],
                  "type-case": [2, "always", "lower-case"],
                  "type-empty": [2, "never"],
                  "type-enum": [2, "always", [
                      "feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert",
                      "product",
                  ]],
              },
          };
          EOF

      - name: Lint commit message
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ${{ inputs.config || '.ci-commitlint.config.mjs' }}

      - name: Check no !fixup commits
        if: github.event_name == 'pull_request'
        uses: 13rac1/block-fixup-merge-action@v2.0.0
