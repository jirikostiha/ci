name: NuGet publish # reusable: push the "packages" artifact to nuget.org via OIDC

on:
  workflow_call:
    inputs:
      user:
        description: "nuget.org account used for OIDC login"
        required: true
        type: string
      packages-dir:
        type: string
        default: "packages"
      environment:
        description: "Deployment environment (approval gate lives in the caller repo)"
        type: string
        default: "production"

jobs:
  push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # OIDC, no long-lived key

    steps:
      - name: Download artifact - packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: ${{ inputs.packages-dir }}

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ inputs.user }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "${{ inputs.packages-dir }}/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
